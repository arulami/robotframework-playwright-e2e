[project]
name = "robotframework-playwright-e2e"
version = "0.1.0"
description = "End-to-end test suite using Robot Framework with the Browser (Playwright) library for UI and RequestsLibrary for API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "robotcode[runner]>=2.6.2",
    "robotframework>=7.4.2",
    "robotframework-browser>=20.0.0",
    "robotframework-requests>=0.9.7",
]
